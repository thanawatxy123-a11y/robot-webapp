<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Control Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        #message { margin-top: 15px; color: red; font-size: 14px; }
    /* ตกแต่งปุ่มลิงก์ด้านล่าง */
        .extra-links {
            margin-top: 15px;
            display: flex;
            justify-content: space-between; /* ดันข้อความไปซ้ายสุด-ขวาสุด */
            font-size: 0.9rem;
        }
        .extra-links a {
            color: #3498db;
            text-decoration: none;
            transition: 0.2s;
        }
        .extra-links a:hover {
            color: #2980b9;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>เข้าสู่ระบบควบคุมรถหุ่นยนต์</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="ชื่อผู้ใช้งาน" required>
        <input type="password" id="password" placeholder="รหัสผ่าน" required>
        <button type="submit">Login</button>
            <div class="extra-links">
                <a href="/forgot.html">ลืมรหัสผ่าน?</a>
                <a href="/register.html">สมัครบัญชีใหม่</a>
            </div>
            <!-- สิ้นสุดส่วนที่เพิ่ม -->

        </form>
        <div id="message"></div>
    </form>
    <div id="message"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault(); // ป้องกันหน้าเว็บรีเฟรช
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const msgBox = document.getElementById('message');

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (data.success) {
                msgBox.style.color = "green";
                msgBox.innerText = `สถานะ: ${data.message} กำลังพาเข้าสู่ระบบ...`;
                
                // เพิ่มคำสั่งหน่วงเวลา 1 วินาทีให้ผู้ใช้เห็นข้อความ แล้วค่อยเด้งไปหน้าแผนที่
                setTimeout(() => {
                    window.location.href = '/map.html';
                }, 1000);
            } else {
                msgBox.style.color = "red";
                msgBox.innerText = data.error;
            }
        } catch (error) {
            msgBox.innerText = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
        }
    });
</script>

</body>
</html>
