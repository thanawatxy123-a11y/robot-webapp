<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Dashboard & Map Control</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #f0f2f5; display: flex; height: 100vh; }
        
        /* แถบเมนูด้านซ้าย */
        .sidebar { width: 250px; background: #2c3e50; color: white; padding: 20px; display: flex; flex-direction: column; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        .sidebar h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .status-box { background: #34495e; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; }
        .status-indicator { display: inline-block; width: 10px; height: 10px; background: #dc3545; border-radius: 50%; margin-right: 5px; }
        
        /* ปุ่มควบคุมต่างๆ */
        .btn { padding: 12px; margin-bottom: 10px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; font-size: 1rem; transition: 0.2s; }
        .btn-connect { background: #27ae60; }
        .btn-connect:hover { background: #219653; }
        .btn-stop { background: #e74c3c; margin-top: auto; }
        .btn-stop:hover { background: #c0392b; }
        
        /* พื้นที่แผนที่ตรงกลาง */
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; }
        .main-content h2 { margin-top: 0; color: #333; }
        
        /* กรอบสำหรับแสดงแผนที่ ROS 2 */
        .map-container { 
            flex: 1; 
            background: #ffffff; 
            border: 2px dashed #bdc3c7; 
            border-radius: 10px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .map-placeholder-text { color: #7f8c8d; font-size: 1.2rem; text-align: center; }
        
        /* แผงควบคุมคิวงาน (Task Queue) */
        .queue-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            width: 250px;
            font-family: sans-serif;
            z-index: 10; /* ดันแผงให้อยู่บนสุดเสมอ */
        }
        .queue-panel h3 { margin-top: 0; font-size: 1.1rem; color: #2c3e50; }
        .queue-list { list-style: none; padding: 0; margin-bottom: 15px; }
        .queue-list li {
            background: #ecf0f1; margin-bottom: 5px; padding: 8px;
            border-radius: 4px; font-size: 0.9rem;
            display: flex; justify-content: space-between;
        }
        .btn-start { background: #27ae60; color: white; width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 5px; }
        .btn-start:hover { background: #2ecc71; }
        .btn-clear { background: #e74c3c; color: white; width: 100%; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-clear:hover { background: #c0392b; }
        
        /* รูปแบบของจุดมาร์คในแผนที่ */
        .map-marker {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: #e74c3c;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            pointer-events: none;
        }
    </style>
    
    <!-- ไลบรารีสำหรับเชื่อมต่อ ROS 2 และวาดแผนที่ -->
    <script src="https://cdn.jsdelivr.net/npm/eventemitter2@6/lib/eventemitter2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    <script src="https://code.createjs.com/1.0.0/easeljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ros2d@0.9.0/build/ros2d.min.js"></script>
</head>
<body>

    <!-- แผงควบคุมด้านซ้าย -->
    <div class="sidebar">
        <h2>⚙️ แผงควบคุม (Dashboard)</h2>
        
        <div class="status-box">
            <div><span class="status-indicator" id="ros-status-dot"></span> <b>สถานะ:</b> <span id="ros-status-text">ยังไม่เชื่อมต่อ</span></div>
            <div style="margin-top: 10px;">🔋 <b>แบตเตอรี่:</b> --%</div>
        </div>

        <button class="btn btn-connect" onclick="connectToRobot()">🔗 เชื่อมต่อหุ่นยนต์</button>
        
        <!-- แผงปุ่มควบคุมทิศทางตรงนี้ -->
        <div style="background: #34495e; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px;">
            <b style="display: block; margin-bottom: 10px;">🎮 บังคับรถ (Manual)</b>
            <button class="btn" style="background: #3498db; width: 60px;" onclick="moveRobot(0.2, 0)">หน้า</button><br>
            <button class="btn" style="background: #3498db; width: 60px;" onclick="moveRobot(0, 0.5)">ซ้าย</button>
            <button class="btn" style="background: #95a5a6; width: 60px;" onclick="moveRobot(0, 0)">หยุด</button>
            <button class="btn" style="background: #3498db; width: 60px;" onclick="moveRobot(0, -0.5)">ขวา</button><br>
            <button class="btn" style="background: #3498db; width: 60px;" onclick="moveRobot(-0.2, 0)">หลัง</button>
        </div>
        
        <!-- ปุ่มหยุดฉุกเฉินให้อยู่ล่างสุด -->
        <button class="btn btn-stop" onclick="emergencyStop()">🛑 Emergency Stop</button>
    </div>

    <!-- พื้นที่แสดงแผนที่ -->
    <div class="main-content">
        <h2>📍 แผนที่นำทาง (2D Map)</h2>
        
        <!-- แก้ไขโครงสร้างกล่องแผนที่ให้ถูกต้อง -->
        <div class="map-container" id="map-container">
            <div class="map-placeholder-text" id="map-placeholder">
                <p>🗺️ พื้นที่แสดงผลแผนที่ 2 มิติจาก ROS 2</p>
                <p style="font-size: 0.9rem; margin-top: -10px;">(รอการเชื่อมต่อผ่าน WebSockets / roslibjs)</p>
            </div>
        </div>
    </div>

    <!-- แผงคิวงานแบบลอยตัว -->
    <div class="queue-panel">
        <h3>📋 คิวส่งของ (สูงสุด 4 จุด)</h3>
        <ul class="queue-list" id="queueList">
            <li>ยังไม่มีคิวงาน...</li>
        </ul>
        <button class="btn-start" onclick="startTaskQueue()">🚀 เริ่มส่งของ & กลับฐาน</button>
        <button class="btn-clear" onclick="clearQueue()">🗑️ ล้างคิวทั้งหมด</button>
    </div>

    <!-- โค้ด JavaScript ทั้งหมดต้องอยู่ในแท็ก script นี้ -->
    <script>
        // สร้างตัวแปรสำหรับเชื่อมต่อ ROS
        const ros = new ROSLIB.Ros();

        // ---------------------------------------------------------
        // การเชื่อมต่อ ROS 2 (สเต็ปที่ 4 อยู่ที่นี่)
        // ---------------------------------------------------------
        ros.on('connection', function() {
            console.log('Connected to websocket server.');
            document.getElementById('ros-status-text').innerText = 'เชื่อมต่อแล้ว';
            document.getElementById('ros-status-text').style.color = '#27ae60';
            document.getElementById('ros-status-dot').style.background = '#27ae60';
            
            // 📍 สเต็ปที่ 4: สั่งวาดแผนที่ทันทีที่เชื่อมต่อติด
            initMap(); 
        });

        ros.on('error', function(error) {
            console.log('Error connecting to websocket server: ', error);
            document.getElementById('ros-status-text').innerText = 'เชื่อมต่อล้มเหลว!';
            document.getElementById('ros-status-dot').style.background = '#e74c3c';
        });

        ros.on('close', function() {
            console.log('Connection to websocket server closed.');
            document.getElementById('ros-status-text').innerText = 'ตัดการเชื่อมต่อ';
            document.getElementById('ros-status-text').style.color = '#333';
            document.getElementById('ros-status-dot').style.background = '#dc3545';
        });

        function connectToRobot() {
            document.getElementById('ros-status-text').innerText = 'กำลังเชื่อมต่อ...';
            // เปลี่ยนเป็นลิงก์ Ngrok ของเรา และต้องใช้ wss:// (มีตัว s) เพื่อความปลอดภัย
            ros.connect('wss://unissued-tactful-encounter.ngrok-free.dev'); 
        }
        }

        // ---------------------------------------------------------
        // ส่วนควบคุมการเคลื่อนที่ (Teleop)
        // ---------------------------------------------------------
        const cmdVel = new ROSLIB.Topic({
            ros : ros,
            name : '/cmd_vel',
            messageType : 'geometry_msgs/msg/Twist'
        });

        function moveRobot(linearSpeed, angularSpeed) {
            if (!ros.isConnected) {
                alert("กรุณากดเชื่อมต่อหุ่นยนต์ก่อนครับ!");
                return;
            }
            const twist = new ROSLIB.Message({
                linear : { x : linearSpeed, y : 0.0, z : 0.0 },
                angular : { x : 0.0, y : 0.0, z : angularSpeed }
            });
            cmdVel.publish(twist);
        }

        function emergencyStop() {
            moveRobot(0.0, 0.0);
            console.log("🛑 สั่งเบรกฉุกเฉินแล้ว!");
        }

        // ---------------------------------------------------------
        // ระบบคิวงาน (Task Queue System) & แผนที่ 2D
        // ---------------------------------------------------------
        let taskQueue = [];
        const MAX_TASKS = 4;
        let viewer; 

        function initMap() {
            // ซ่อนข้อความ Placeholder ทิ้งไป
            document.getElementById('map-placeholder').style.display = 'none';

            // ล้างหน้าจอแผนที่เดิมทิ้ง (เผื่อกดเชื่อมต่อซ้ำ)
            const mapContainer = document.getElementById('map-container');
            
            // ป้องกันไม่ให้วาดแผนที่ซ้อนกันหลายรอบ
            if (!viewer) {
                viewer = new ROS2D.Viewer({
                    divID : 'map-container',
                    width : 600,
                    height : 600
                });

                const gridClient = new ROS2D.OccupancyGridClient({
                    ros : ros,
                    rootObject : viewer.scene,
                    continuous: true
                });

                gridClient.on('change', function() {
                    viewer.scaleToDimensions(gridClient.currentGrid.width, gridClient.currentGrid.height);
                    viewer.shift(gridClient.currentGrid.pose.position.x, gridClient.currentGrid.pose.position.y);
                });

                // ดักจับเหตุการณ์คลิกแผนที่
                viewer.scene.addEventListener('stagemousedown', function(event) {
                    if (taskQueue.length >= MAX_TASKS) {
                        alert('คิวเต็มแล้วครับ! (รับได้สูงสุด 4 จุด)');
                        return;
                    }

                    const pos = viewer.scene.globalToRos(event.stageX, event.stageY);
                    
                    taskQueue.push({
                        x: pos.x.toFixed(2),
                        y: pos.y.toFixed(2)
                    });

                    updateQueueDisplay(); 
                });
            }
        }

        function updateQueueDisplay() {
            const queueList = document.getElementById('queueList');
            queueList.innerHTML = ''; 

            if (taskQueue.length === 0) {
                queueList.innerHTML = '<li>ยังไม่มีคิวงาน...</li>';
                return;
            }

            taskQueue.forEach((task, index) => {
                const li = document.createElement('li');
                li.innerHTML = `📍 จุดที่ ${index + 1} : ( X: ${task.x}, Y: ${task.y} )`;
                queueList.appendChild(li);
            });
        }

        function clearQueue() {
            taskQueue = [];
            updateQueueDisplay();
            
            // ลบจุดมาร์คสีแดงทั้งหมดออกจากแผนที่
            let markers = document.querySelectorAll('.map-marker');
            markers.forEach(marker => marker.remove());
        }

        // ---------------------------------------------------------
        // เฟส 3: ระบบขับเคลื่อน (ใช้ Topic /goal_pose เลียนแบบปุ่ม Nav2 Goal ใน RViz)
        // ---------------------------------------------------------
        
        // 1. สร้างช่องทางส่งพิกัดไปที่ Topic /goal_pose โดยตรง
        const goalTopic = new ROSLIB.Topic({
            ros: ros,
            name: '/goal_pose',
            messageType: 'geometry_msgs/msg/PoseStamped'
        });

        // 2. ฟังก์ชันสั่งรถวิ่ง (ผูกกับปุ่ม "เริ่มส่งของ & กลับฐาน")
        function startTaskQueue() {
            // เช็กว่ามีพิกัดในคิวที่ถูกคลิกไว้หรือยัง
            if (typeof taskQueue === 'undefined' || taskQueue.length === 0) {
                alert("กรุณาคลิกเลือกพิกัดบนแผนที่ก่อนครับ!");
                return;
            }

            // ⚠️ เพื่อความชัวร์ในการทดสอบรอบนี้ เราจะสั่งให้วิ่งไปแค่ "จุดแรก" จุดเดียวก่อนครับ
            const target = taskQueue[0]; 
            console.log(`🚀 กำลังส่งคำสั่งไปเป้าหมาย: X=${target.x}, Y=${target.y}`);

            // 3. แพ็กข้อมูลพิกัด (ตั้งค่า frame_id เป็น 'map' ให้ตรงกับโลกจำลอง)
            const poseMsg = new ROSLIB.Message({
                header: { 
                    frame_id: 'map'
                },
                pose: {
                    position: { 
                        x: parseFloat(target.x), 
                        y: parseFloat(target.y), 
                        z: 0.0 
                    },
                    orientation: { 
                        x: 0.0, 
                        y: 0.0, 
                        z: 0.0, 
                        w: 1.0 // กำหนดให้หันหน้าไปทิศทางเริ่มต้น
                    }
                }
            });

            // 4. ยิงคำสั่งทะลุเข้า Nav2 ทันที!
            goalTopic.publish(poseMsg);
            
            // แจ้งเตือนที่หน้าเว็บเพื่อให้รู้ว่ายิงคำสั่งออกไปแล้ว
            alert(`ส่งพิกัด (X: ${target.x}, Y: ${target.y}) สำเร็จ! หันไปดูล้อรถใน Gazebo ได้เลยครับ`);
            
            // ล้างหน้าจอคิวงานบนเว็บ
            if (typeof clearQueue === 'function') {
                clearQueue(); 
            }
        }

        // ---------------------------------------------------------
        // ระบบวาดจุดมาร์คสีแดงบนแผนที่แบบแม่นยำ (แก้บั๊กหลุดขอบ + ครบ 4 จุด)
        // ---------------------------------------------------------
        document.getElementById('map-container').addEventListener('click', function(event) {
            
            // ให้นับจำนวนจุดสีแดงที่มีอยู่บนหน้าจอตอนนี้เลย
            let currentMarkers = document.querySelectorAll('.map-marker');
            
            // ถ้ามีจุดแดงครบ 4 จุดแล้ว ค่อยบล็อกไม่ให้วาดเพิ่ม
            if (currentMarkers.length >= 4) return; 

            let marker = document.createElement('div');
            marker.className = 'map-marker';
            
            // ใช้ค่า clientX/clientY ลบกับระยะขอบของกล่อง ทำให้จุดตรงเป๊ะ
            let rect = this.getBoundingClientRect();
            marker.style.left = (event.clientX - rect.left) + 'px';
            marker.style.top = (event.clientY - rect.top) + 'px';
            
            this.appendChild(marker);
        });
    </script>
</body>
</html>
