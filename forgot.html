<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กู้คืนรหัสผ่านด้วย OTP - Robot Control</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .reset-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; }
        .reset-box h2 { margin-top: 0; color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #e67e22; color: white; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; transition: 0.3s; margin-top: 10px; font-weight: bold; }
        button:hover { background-color: #d35400; }
        .btn-secondary { background-color: #3498db; }
        .btn-secondary:hover { background-color: #2980b9; }
        #message { margin-top: 15px; font-size: 0.9rem; font-weight: bold; }
        .extra-links { margin-top: 20px; font-size: 0.9rem; }
        .extra-links a { color: #3498db; text-decoration: none; }
        /* ซ่อนสเต็ปที่ 2 ไว้ก่อน */
        #step2 { display: none; }
    </style>
</head>
<body>

<div class="reset-box">
    <h2>🔑 กู้คืนรหัสผ่าน (OTP)</h2>
    
    <!-- สเต็ปที่ 1: กรอกชื่อผู้ใช้ และ อีเมล -->
    <div id="step1">
        <input type="text" id="username" placeholder="ชื่อผู้ใช้งาน (Username)" required>
        <input type="email" id="email" placeholder="อีเมลของคุณ (เพื่อรับ OTP)" required>
        <button type="button" class="btn-secondary" onclick="requestOTP()">📧 ส่งรหัส OTP ไปที่อีเมล</button>
    </div>

    <!-- สเต็ปที่ 2: กรอก OTP และ รหัสผ่านใหม่ -->
    <div id="step2">
        <input type="text" id="otp" placeholder="กรอกรหัส OTP 6 หลัก" maxlength="6" required>
        <input type="password" id="new_password" placeholder="ตั้งรหัสผ่านใหม่" required>
        <button type="button" onclick="resetPassword()">✅ ยืนยันการเปลี่ยนรหัสผ่าน</button>
    </div>

    <div id="message"></div>

    <div class="extra-links">
        <a href="/login.html">⬅️ กลับไปหน้าล็อกอิน</a>
    </div>
</div>

<script>
    const msgBox = document.getElementById('message');

    // ฟังก์ชันขอรหัส OTP
    async function requestOTP() {
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;

        if (!username || !email) {
            msgBox.style.color = "red";
            msgBox.innerText = "กรุณากรอกชื่อผู้ใช้และอีเมลให้ครบถ้วนครับ";
            return;
        }

        msgBox.style.color = "#d35400";
        msgBox.innerText = "⏳ กำลังส่งรหัส OTP ไปยังอีเมลของคุณ...";

        try {
            const res = await fetch('/api/request-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email })
            });
            const data = await res.json();

            if (data.success) {
                msgBox.style.color = "green";
                msgBox.innerText = "ส่งรหัส OTP สำเร็จ! กรุณาเช็กในกล่องข้อความอีเมลครับ";
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
            } else {
                msgBox.style.color = "red";
                msgBox.innerText = data.error;
            }
        } catch (err) {
            msgBox.style.color = "red";
            msgBox.innerText = "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้";
        }
    }

    // ฟังก์ชันยืนยัน OTP + เปลี่ยนรหัสผ่าน
    async function resetPassword() {
        const username = document.getElementById('username').value;
        const otp = document.getElementById('otp').value;
        const new_password = document.getElementById('new_password').value;

        if (!otp || !new_password) {
            msgBox.style.color = "red";
            msgBox.innerText = "กรุณากรอก OTP และรหัสผ่านใหม่ครับ";
            return;
        }

        try {
            const res = await fetch('/api/verify-otp-reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, otp, new_password })
            });
            const data = await res.json();

            if (data.success) {
                msgBox.style.color = "green";
                msgBox.innerText = "เปลี่ยนรหัสผ่านสำเร็จ! กำลังพากลับหน้าล็อกอิน...";
                setTimeout(() => window.location.href = '/login.html', 2000);
            } else {
                msgBox.style.color = "red";
                msgBox.innerText = data.error;
            }
        } catch (err) {
            msgBox.style.color = "red";
            msgBox.innerText = "เกิดข้อผิดพลาดในการส่งข้อมูล";
        }
    }
</script>
</body>
</html>
