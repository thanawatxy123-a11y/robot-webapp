<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Control Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        #message { margin-top: 15px; font-size: 14px; }
    /* ตกแต่งปุ่มลิงก์ด้านล่าง */
        .extra-links {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }
        .extra-links a {
            color: #3498db;
            text-decoration: none;
            transition: 0.2s;
        }
        .extra-links a:hover {
            color: #2980b9;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>เข้าสู่ระบบควบคุมรถหุ่นยนต์</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="ชื่อผู้ใช้งาน" required>
        <input type="password" id="password" placeholder="รหัสผ่าน" required>
        <button type="submit">Login</button>
            <div class="extra-links">
                <a href="/forgot.html">ลืมรหัสผ่าน?</a>
                <a href="/register.html">สมัครบัญชีใหม่</a>
            </div>
    </form>
    <div id="message"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault(); // ป้องกันหน้าเว็บรีเฟรช
        
        const msgBox = document.getElementById('message');
        msgBox.style.color = "green";
        msgBox.innerText = `สถานะ: เข้าสู่ระบบสำเร็จ กำลังพาเข้าสู่หน้าควบคุม...`;
        
        // หน่วงเวลา 1 วินาที แล้วเด้งไปหน้าแผนที่เลย
        setTimeout(() => {
            window.location.href = '/map.html';
        }, 1000);
    });
</script>

</body>
</html>
